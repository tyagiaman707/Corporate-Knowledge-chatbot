# ============================================================
# Corporate Knowledge Assist Chatbot - Application Properties
# ============================================================

# Server (Railway injects PORT automatically)
server.port=${PORT:8081}
spring.application.name=corporate-knowledge-chatbot

# ??? MySQL Database (Railway injects these automatically) ????
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ??? JPA / Hibernate ????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ??? JWT Configuration ??????????????????????????????????????
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ??? File Upload ????????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ??? OpenAI API (ChatGPT) ???????????????????????????????????
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-3.5-turbo

# ??? PDF Chunking Settings ??????????????????????????????????
app.chunk.max-words=400
app.chunk.min-words=100

# ??? Logging ????????????????????????????????????????????????
logging.level.com.example.corporate_knowledge_chatbot=DEBUG
logging.level.org.springframework.security=INFO